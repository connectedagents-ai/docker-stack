# OneWishOS Docker Stack — Core Services
# Traefik reverse proxy, Portainer management, Postgres, Redis, Qdrant

services:
  traefik:
    image: traefik:v3.4
    container_name: onewish-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
    networks:
      - onewish-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  portainer:
    image: portainer/portainer-ce:2.27.3
    container_name: onewish-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.localhost`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    networks:
      - onewish-net
    healthcheck:
      disable: true
      # Portainer CE is a scratch image with no shell or http tools.
      # Health is verified externally via scripts/health-check.sh

  postgres:
    image: postgres:17-alpine
    container_name: onewish-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onewish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-onewish}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - onewish-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onewish} -d ${POSTGRES_DB:-onewish}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: onewish-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file:
      - ../.env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redisdata:/data
    networks:
      - onewish-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-changeme} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: onewish-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    env_file:
      - ../.env
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - onewish-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  qdrantdata:
    driver: local
  portainer_data:
    driver: local

networks:
  onewish-net:
    driver: bridge
