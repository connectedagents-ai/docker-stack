global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'n8n'
    metrics_path: /metrics
    static_configs:
      - targets: ['onewish-n8n:5678']

  - job_name: 'grafana'
    static_configs:
      - targets: ['onewish-grafana:3000']

  - job_name: 'qdrant'
    metrics_path: /metrics
    static_configs:
      - targets: ['onewish-qdrant:6333']
