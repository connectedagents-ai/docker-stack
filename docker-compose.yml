services:
  # ============================================================
  # CORE INFRASTRUCTURE
  # ============================================================
  traefik:
    image: traefik:v3.4
    container_name: onewish-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - onewish-net
    healthcheck:
      test: ["CMD-SHELL", "traefik healthcheck --ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  portainer:
    image: portainer/portainer-ce:2.27.3
    container_name: onewish-portainer
    restart: unless-stopped
    ports:
      - "9001:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - onewish-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: onewish-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: onewish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./compose/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - onewish-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onewish"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: onewish-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - onewish-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: onewish-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - onewish-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # AGENTS
  # ============================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: onewish-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_INSTANCE_OWNER_EMAIL: "rbailey@powerconnection.com"
      N8N_INSTANCE_OWNER_FIRST_NAME: "Robert"
      N8N_INSTANCE_OWNER_LAST_NAME: "Bailey"
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_OWNER_PASSWORD_HASH}
      N8N_RELEASE_TYPE: "stable"
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "onewish-postgres"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "n8n"
      DB_POSTGRESDB_USER: "onewish"
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: "America/Chicago"
    volumes:
      - n8ndata:/home/node/.n8n
    networks:
      - onewish-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # MONITORING
  # ============================================================
  grafana:
    image: grafana/grafana-oss:latest
    container_name: onewish-grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - onewish-net

  prometheus:
    image: prom/prometheus:latest
    container_name: onewish-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - onewish-net

  dozzle:
    image: amir20/dozzle:latest
    container_name: onewish-dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - onewish-net

  # ============================================================
  # GRAPH DATABASE
  # ============================================================
  neo4j:
    image: neo4j:5-community
    container_name: onewish-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/changeme}"
      NEO4J_PLUGINS: '["apoc"]'
    networks:
      - onewish-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  intelligenceos-neo4j:
    image: neo4j:5-community
    container_name: intelligenceos-neo4j
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - intelligenceos-neo4j-data:/data
      - intelligenceos-neo4j-logs:/logs
    environment:
      NEO4J_AUTH: "${INTELLIGENCEOS_NEO4J_AUTH:-neo4j/changeme}"
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # MCP SERVERS
  # ============================================================
  mcp-filesystem:
    image: node:22-alpine
    container_name: onewish-mcp-filesystem
    restart: unless-stopped
    volumes:
      - /Users/robertbailey:/data:ro
    networks:
      - onewish-net
    command: npx -y @modelcontextprotocol/server-filesystem /data

  mcp-memory:
    image: node:22-alpine
    container_name: onewish-mcp-memory
    restart: unless-stopped
    volumes:
      - mcp_memory_data:/data
    networks:
      - onewish-net
    command: npx -y @modelcontextprotocol/server-memory --data-dir /data

  mcp-sequential:
    image: node:22-alpine
    container_name: onewish-mcp-sequential
    restart: unless-stopped
    networks:
      - onewish-net
    command: npx -y @modelcontextprotocol/server-sequential-thinking

  # ============================================================
  # INTELLIGENCEOS N8N (secondary)
  # ============================================================
  intelligenceos-n8n:
    image: n8nio/n8n:latest
    container_name: intelligenceos-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: ${INTELLIGENCEOS_N8N_PASSWORD:-changeme}
      N8N_ENCRYPTION_KEY: ${INTELLIGENCEOS_N8N_ENCRYPTION_KEY}
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "onewish-postgres"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "intelligenceos_n8n"
      DB_POSTGRESDB_USER: "onewish"
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: "America/Chicago"
    volumes:
      - intelligenceos_n8ndata:/home/node/.n8n
    networks:
      - onewish-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # APPLICATION CONTAINERS
  # ============================================================
  gforce-web:
    build:
      context: ./gforce
      dockerfile: Dockerfile.web
    container_name: gforce-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - onewish-net

  gforce-router:
    build:
      context: ./gforce
      dockerfile: Dockerfile.router
    container_name: gforce-router
    restart: unless-stopped
    ports:
      - "9000:9000"
    networks:
      - onewish-net

# ============================================================
# NETWORKS
# ============================================================
networks:
  onewish-net:
    driver: bridge

# ============================================================
# VOLUMES
# ============================================================
volumes:
  portainer_data:
  pgdata:
  redisdata:
  qdrantdata:
  n8ndata:
  grafana_data:
  prometheus_data:
  neo4j_data:
  neo4j_logs:
  intelligenceos-neo4j-data:
  intelligenceos-neo4j-logs:
  mcp_memory_data:
  intelligenceos_n8ndata:
